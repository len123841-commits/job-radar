# =============================================================
# Job Radar 常见求职画像模板集
# -------------------------------------------------------------
# 用法：挑一个和你方向最接近的模板，把它的内容复制到你自己的
# my_profile.yaml（可从 default_profile.yaml 复制而来），
# 再按需微调 search_terms / direction_pool / cities / 薪资。
#
# 运行：
#   python3 scripts/job_radar.py plan   --profile assets/my_profile.yaml
#   python3 scripts/job_radar.py search --profile assets/my_profile.yaml
#
# 字段说明见 references/profile-schema.md
# =============================================================


# =============================================================
# 模板 1：海外运营 / 出海运营
# =============================================================
overseas_operations:
  version: 1
  candidate:
    name: 你的名字
    note: 海外/出海运营方向，覆盖 Global Campaign、Creator 增长、社媒与内容运营。
    highlights:
      - 多区域 Campaign 交付经验
      - Creator / 达人增长
      - 海外社媒与内容运营
    search_terms:
      - 海外运营
      - 出海运营
      - 国际化运营
      - Global Campaign
      - Creator Growth
      - Live Operations
    direction_pool:
      tier_1_strong:
        - 海外运营
        - 出海运营
        - Global Campaign
        - Creator Operations
      tier_2_potential:
        - 社媒运营
        - 内容运营
        - 用户增长运营
      tier_3_extended:
        - 策略运营
        - GTM运营
    score_keywords:
      - overseas
      - global
      - creator
      - campaign
      - livestream
      - marketing
      - 海外
      - 出海
      - 运营
  search:
    cities: [北京, 上海, 深圳, 杭州, remote]
    remote_ok: true
    min_monthly_salary_k: 20
    max_monthly_salary_k: 60
    platforms: [linkedin, indeed, google, boss]
    jobspy_results_per_search: 12
    hours_old: 72
  output:
    top_n: 50


